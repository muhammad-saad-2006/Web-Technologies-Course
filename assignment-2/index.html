<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Allbirds: Comfortable, Sustainable Shoes and Apparel</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sticky header -->
    <header class="sticky-top">
      <!-- Announcement bar -->
      <div
        class="announcement-bar bg-dark text-white d-flex align-items-center justify-content-between position-relative px-1 py-2"
      >
        <button
          class="d-flex bg-transparent border-0 p-0 text-white"
          id="previous-announcement"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <p
          id="announcement-message"
          class="position-absolute start-0 end-0 px-5 m-0 text-center lh-1 pe-none"
        >
          Due to increased demand, orders may take up to 30 days to ship.
        </p>
        <button
          class="d-flex bg-transparent border-0 p-0 text-white"
          id="next-announcement"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Navbar -->
      <nav
        class="navbar navbar-expand-lg bg-white rounded-4 shadow-sm position-absolute top 100 start-0 end-0 mx-3 mt-3 px-3 py-0 py-lg-1"
      >
        <button
          class="navbar-toggler border-0 p-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-menu"
        >
          <i class="bi bi-list fs-5"></i>
        </button>

        <a class="navbar-brand mx-auto mx-lg-0" href="#">
          <img
            src="images/allbirds-logo.png"
            alt="Allbirds logo"
            height="30"
            class="d-block"
          />
        </a>

        <div
          class="collapse navbar-collapse order-last order-lg-0"
          id="main-menu"
        >
          <ul
            class="navbar-nav flex-grow-1 justify-content-center gap-lg-4 text-uppercase fw-semibold small"
          >
            <li class="nav-item">
              <a class="nav-link link-dark" href="#">New Arrivals</a>
            </li>
            <li class="nav-item">
              <a class="nav-link link-dark" href="#">Shop All</a>
            </li>
            <li class="nav-item">
              <a class="nav-link link-dark" href="#">Men</a>
            </li>
            <li class="nav-item">
              <a class="nav-link link-dark" href="#">Women</a>
            </li>
          </ul>
        </div>

        <div class="d-flex gap-3 fs-5">
          <button class="bg-transparent border-0 p-0 text-dark">
            <i class="bi bi-search"></i>
          </button>
          <button class="bg-transparent border-0 p-0 text-dark">
            <i class="bi bi-bag"></i>
          </button>
        </div>
      </nav>
    </header>

    <!-- Main Page Content -->
    <main class="p-2">
      <section class="hero position-relative w-100 overflow-hidden rounded-5">
        <picture>
          <source
            media="(max-width: 991.98px)"
            srcset="images/hero-campaign-mobile.png"
          />
          <img
            src="images/hero-campaign.png"
            alt="Allbirds footwear campaign"
            class="d-block w-100 h-100 object-fit-cover"
          />
        </picture>

        <div
          class="position-absolute bottom-0 start-0 end-0 p-4 p-lg-5 text-white d-flex flex-column align-items-start align-items-lg-end text-lg-end"
        >
          <p class="hero-eyebrow font-monospace text-uppercase mb-2">
            All new Dasher NZ collection
          </p>
          <h1 class="fs-4 fw-normal mb-3">Wildly Comfortable. Super Natural</h1>
          <div class="d-flex gap-2">
            <a
              href="men.html"
              class="btn btn-hero btn-sm rounded-pill px-4 text-uppercase fw-semibold"
              >Shop Men</a
            >
            <a
              href="women.html"
              class="btn btn-hero btn-sm rounded-pill px-4 text-uppercase fw-semibold"
              >Shop Women</a
            >
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
